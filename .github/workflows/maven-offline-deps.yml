name: Maven Offline Dependencies (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\.m2\repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Download dependencies (go-offline)
        run: mvn dependency:go-offline -B

      - name: Compress local Maven repo
        shell: pwsh
        run: |
          $m2Path = "C:\Users\runneradmin\.m2"
          Compress-Archive -Path "$m2Path\repository" -DestinationPath "$m2Path\m2-repo.zip"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: offline-deps-${{ github.run_number }}
          name: "Offline Maven Dependencies ${{ github.run_number }}"
          files: C:\Users\runneradmin\.m2\m2-repo.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: index-app
  namespace: index-system
  labels:
    app: index
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: index
  template:
    metadata:
      labels:
        app: index
        version: v1
    spec:
      containers:
      - name: index-app
        image: index:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: JAVA_OPTS
          value: "-Xms1g -Xmx2g -XX:+UseG1GC"
        - name: LOG_PATH
          value: "/var/log/index"
        envFrom:
        - secretRef:
            name: index-secrets
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
        - name: log-volume
          mountPath: /var/log/index
        - name: data-volume
          mountPath: /data
      volumes:
      - name: config-volume
        configMap:
          name: index-config
      - name: log-volume
        emptyDir: {}
      - name: data-volume
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

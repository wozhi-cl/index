apiVersion: v1
kind: Secret
metadata:
  name: index-secrets
  namespace: index-system
type: Opaque
data:
  # 数据库凭据
  DB_USERNAME: <base64-encoded-username>
  DB_PASSWORD: <base64-encoded-password>
  DB_HOST: <base64-encoded-host>
  DB_PORT: <base64-encoded-port>
  DB_SID: <base64-encoded-sid>
  
  # Elasticsearch 凭据
  ES_URL: <base64-encoded-url>
  ES_USERNAME: <base64-encoded-username>
  ES_PASSWORD: <base64-encoded-password>
  ES_CLUSTER: <base64-encoded-cluster>
  
  # GetQuick 凭据
  GQ_URL: <base64-encoded-url>
  GQ_USERNAME: <base64-encoded-username>
  GQ_PASSWORD: <base64-encoded-password>
  
  # 业务配置
  DATA_TABLE: <base64-encoded-table>
  DELTA_TABLE: <base64-encoded-delta-table>
  TIME_COLUMN: <base64-encoded-column>
  INDEX_NAME: <base64-encoded-index>
  GQ_INDEX: <base64-encoded-gq-index>

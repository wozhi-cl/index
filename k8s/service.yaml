apiVersion: v1
kind: Service
metadata:
  name: index-service
  namespace: index-system
  labels:
    app: index
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: index
---
apiVersion: v1
kind: Service
metadata:
  name: index-service-lb
  namespace: index-system
  labels:
    app: index
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: index

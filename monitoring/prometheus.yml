global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # 应用指标
  - job_name: 'index-app'
    static_configs:
      - targets: ['index-app:8080']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 30s

  # Elasticsearch 指标
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9200']
    metrics_path: '/_prometheus/metrics'

# ========================================
# 字段映射配置文件 - 连表示例
# ========================================

field-mappings:
  # 源表字段映射配置
  source-mappings:
    # 订单表（关联用户表）
    orders:
      fields:
        - name: id
          type: LONG
          alias: order_id
          is-key: true
          required: true
          order: 1
        
        - name: order_no
          type: STRING
          alias: order_no
          required: true
          order: 2
        
        - name: amount
          type: DOUBLE
          alias: amount
          required: true
          order: 3
        
        - name: user_id
          type: LONG
          alias: user_id
          required: true
          order: 4
        
        - name: created_at
          type: TIMESTAMP
          alias: order_time
          required: true
          order: 5
      
      joins:
        - table: users
          on-field: user_id
          type: LEFT
          fields:
            - name: name
              type: STRING
              alias: user_name
              order: 6
            
            - name: phone
              type: STRING
              alias: user_phone
              order: 7

  # 索引字段映射配置
  index-mappings:
    # 订单索引（包含用户信息）
    order_index:
      source-table: orders
      fields:
        - name: order_id
          type: keyword
          source-field: order_id
          searchable: false
          sortable: true
          order: 1
        
        - name: order_no
          type: keyword
          source-field: order_no
          searchable: true
          sortable: true
          order: 2
        
        - name: amount
          type: double
          source-field: amount
          searchable: false
          sortable: true
          order: 3
        
        - name: user_name
          type: text
          source-field: user_name
          searchable: true
          sortable: false
          analyzer: ik_max_word
          order: 4
        
        - name: user_phone
          type: keyword
          source-field: user_phone
          searchable: true
          sortable: false
          order: 5
        
        - name: order_time
          type: date
          source-field: order_time
          searchable: false
          sortable: true
          format: "yyyy-MM-dd HH:mm:ss"
          order: 6

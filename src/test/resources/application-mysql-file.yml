# MySQL 到 File 的测试配置
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/test_index?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
    
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:org/springframework/batch/core/schema-mysql.sql

# 索引配置
index:
  dataSource:
    type: mysql
    table: orders
    
  indexTarget:
    type: file
    path: ./output/mysql-file
    fileName: mysql-file-output.json
    format: json
    
  parallelism:
    chunkSize: 100
    
  retry:
    maxAttempts: 3

# 日志配置
logging:
  level:
    com.company.index: DEBUG
    org.springframework.batch: INFO
    org.springframework.jdbc: DEBUG

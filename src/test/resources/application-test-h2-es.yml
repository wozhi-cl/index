# H2 → Elasticsearch 组合测试配置
# 注意：需要 Elasticsearch 服务或使用 Mock

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  
  sql:
    init:
      mode: always
      schema-locations: classpath:init-h2.sql
  
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

index:
  parallelism:
    chunkSize: 10
    threads: 2
  
  retry:
    backoff:
      initial: 1000
      max: 10000
      attempts: 3
  
  check:
    thresholds:
      errorRate: 0.05
      sampleSize: 100
  
  dataSource:
    type: h2
    table: sample_data
    deltaTable: sample_data_changelog
    timeColumn: updated_at
  
  indexTarget:
    type: elasticsearch
    url: ${ES_URL:http://localhost:9200}
    username: ${ES_USERNAME:elastic}
    password: ${ES_PASSWORD:changeme}
    indexName: test_index
  
  distributed:
    lock:
      type: memory

logging:
  level:
    com.company.index: DEBUG
    org.springframework.batch: INFO


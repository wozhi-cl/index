# 测试环境配置文件

spring:
  config:
    import:
      - classpath:field-mapping.yml
  # H2测试数据库配置
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  
  # SQL初始化
  sql:
    init:
      mode: always
      schema-locations: classpath:init-h2.sql
      encoding: UTF-8
  
  # Spring Batch配置
  batch:
    job:
      enabled: false  # 测试时禁用自动启动
    jdbc:
      initialize-schema: always  # 自动创建Batch表
  
  # 禁用Redis和Elasticsearch
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration

# 索引配置
index:
  parallelism:
    chunkSize: 10
    threads: 2
    partitions: 2
  
  retry:
    backoff:
      initial: 1000
      max: 10000
      attempts: 3
  
  check:
    thresholds:
      errorRate: 0.05
      sampleSize: 100
  
  dataSource:
    type: h2
    table: sample_data
    deltaTable: sample_data_changelog
    timeColumn: updated_at
  
  indexTarget:
    type: file
    path: ./target/test-output
    fileName: test-output.json
  
  distributed:
    lock:
      type: memory
      timeout: 60
      retry:
        max: 3
        interval: 1000

  incremental:
    overlapMinutes: 5

# 日志配置
logging:
  level:
    com.company.index: DEBUG
    org.springframework.batch: INFO
    org.springframework.jdbc: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

